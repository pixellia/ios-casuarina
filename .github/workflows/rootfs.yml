name: rootfs
# Builds on macos-15-intel (native HFS+ and APFS):
#   1. min-root-hfs (56 MiB case-sensitive journaled HFS+ test root with /sbin/launchd = sweet-init, for 64 MiB logdump)
#   2. topaz-ios    (libtopaz-gl.dylib, libtopaz-inject.dylib, backboardd-wrap)
#   3. mesa-ios     (Mesa 25.0.7 freedreno+softpipe libOSMesa.8.dylib + gputest)
#   4. ios16-root   (Optional via workflow_dispatch build_full_root=true: 14 GiB iOS 16.7.16 20H392 HFS+ root image)

on:
  workflow_dispatch:
    inputs:
      build_full_root:
        description: "Also build the 14 GiB iOS 16.7.16 (20H392) HFS+ root image"
        required: false
        default: "false"
  push:
    branches: [main, vince]
    paths:
      - ".github/workflows/rootfs.yml"
      - "tools/mkiosroot.sh"
      - "tools/sweet-root-tweaks.py"

jobs:
  min-hfs:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build 56 MiB HFS+ test root (min-root.hfs / min-root.simg)
        run: |
          set -euo pipefail
          mkdir -p out-min-hfs mnt
          CC=$(xcrun --sdk iphoneos -f clang)
          "$CC" -target arm64-apple-ios16.0 -c tools/sweet-init.S -o sweet-init.o
          python3 tools/mkinit.py sweet-init.o out-min-hfs/sweet-init
          chmod 0755 out-min-hfs/sweet-init

          dd if=/dev/zero of=zero.img bs=1048576 count=56
          cp zero.img out-min-hfs/min-root.hfs
          DEV=$(hdiutil attach -imagekey diskimage-class=CRawDiskImage -nomount out-min-hfs/min-root.hfs | head -n1 | awk '{print $1}')
          RDEV=${DEV/disk/rdisk}
          newfs_hfs -s -J -v iOSRoot "$RDEV"
          hdiutil detach "$DEV"
          DEV=$(hdiutil attach -imagekey diskimage-class=CRawDiskImage -nobrowse -owners on -mountpoint "$PWD/mnt" out-min-hfs/min-root.hfs | head -n1 | awk '{print $1}')

          sudo mkdir -p mnt/sbin mnt/dev mnt/private/var/db/diagnostics/timesync mnt/private/var/db/uuidtext mnt/private/var/keybags
          sudo cp out-min-hfs/sweet-init mnt/sbin/launchd
          sudo chown 0:0 mnt/sbin/launchd
          sudo chmod 0755 mnt/sbin/launchd
          sudo chown -R 272:272 mnt/private/var/db/diagnostics mnt/private/var/db/uuidtext
          sudo chmod 0751 mnt/private/var/db/diagnostics
          sudo chmod 0755 mnt/private/var/db/uuidtext mnt/private/var/db/diagnostics/timesync
          for d in diagnostics uuidtext diagnostics/timesync; do
            sudo touch "mnt/private/var/db/$d/.migrated"
            sudo chown 272:272 "mnt/private/var/db/$d/.migrated"
            sudo chmod 0644 "mnt/private/var/db/$d/.migrated"
          done
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict><key>KeyBagKeys</key><data>U1dFRVQ=</data></dict></plist>' | \
            sudo tee mnt/private/var/keybags/systembag.kb >/dev/null
          sudo chown 0:0 mnt/private/var/keybags mnt/private/var/keybags/systembag.kb
          sudo chmod 0700 mnt/private/var/keybags
          sudo chmod 0600 mnt/private/var/keybags/systembag.kb

          ls -la mnt mnt/sbin
          hdiutil detach "$DEV"
          python3 tools/sparsediff.py zero.img out-min-hfs/min-root.hfs out-min-hfs/min-root.simg
          ls -lh out-min-hfs
      - name: Upload min-root-hfs
        uses: actions/upload-artifact@v4
        with:
          name: min-root-hfs
          path: out-min-hfs/

  topaz:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build topaz GL and backboardd wrapper
        run: |
          set -o pipefail
          bash userland/gpu/mk-topaz-ci.sh 2>&1 | tee topaz-build.log
      - name: Upload topaz-ios
        uses: actions/upload-artifact@v4
        with:
          name: topaz-ios
          path: build-topaz/out/

  mesa:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          brew install meson ninja bison flex pkg-config
          xcrun --sdk iphoneos --show-sdk-path
      - name: Build Mesa 25.0.7 (freedreno + softpipe, OSMesa) + gputest
        run: |
          tr -d '\r' < userland/mesa/mk-mesa-ci.sh > /tmp/mk-mesa-ci.sh
          chmod +x /tmp/mk-mesa-ci.sh
          bash /tmp/mk-mesa-ci.sh
      - name: Logs of a failed build
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mesa-logs
          path: |
            build-mesa/meson-setup.log
            build-mesa/ninja.log
            build-mesa/build-*/meson-logs/meson-log.txt
      - name: Upload mesa-ios
        uses: actions/upload-artifact@v4
        with:
          name: mesa-ios
          path: build-mesa/out/