name: rootfs
# Builds on macos-15-intel (native HFS+ and APFS):
#   1. ios16-root   (15 GiB iOS 16.7.16 20H392 Case-Sensitive Journaled HFS+ root image with Cryptexes, sweet-root-tweaks, Mesa, and Topaz)
#   2. min-root-hfs (Optional via workflow_dispatch: 56 MiB HFS+ test root)

on:
  workflow_dispatch:
  push:
    branches: [main, vince]
    paths:
      - ".github/workflows/rootfs.yml"
      - "tools/mkiosroot-macos.sh"
      - "tools/sweet-root-tweaks.py"
      - "tools/sparsediff.py"

jobs:
  ios16-root:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Mesa (freedreno + softpipe) and build Topaz GL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p mesa-out
          if ! gh run download 43040805792 -n mesa-ios -D mesa-out; then
            echo "Fallback: building mesa-ios from source..."
            brew install meson ninja bison flex pkg-config
            tr -d '\r' < userland/mesa/mk-mesa-ci.sh > /tmp/mk-mesa-ci.sh
            bash /tmp/mk-mesa-ci.sh
            cp -a build-mesa/out/* mesa-out/
          fi
          ls -lh mesa-out

          tr -d '\r' < userland/gpu/mk-topaz-ci.sh > /tmp/mk-topaz-ci.sh
          bash /tmp/mk-topaz-ci.sh
          ls -lh build-topaz/out

      - name: Build 15 GiB iOS 16.7.16 (20H392) HFS+ Root Image (ios16-root.simg)
        run: |
          set -euo pipefail
          IPSW_URL="https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"
          tr -d '\r' < tools/mkiosroot-macos.sh > /tmp/mkiosroot-macos.sh
          chmod +x /tmp/mkiosroot-macos.sh
          bash /tmp/mkiosroot-macos.sh "$IPSW_URL" out-ios16-root mesa-out build-topaz/out 15

      - name: Upload ios16-root-meta
        uses: actions/upload-artifact@v4
        with:
          name: ios16-root-meta
          path: |
            out-ios16-root/ios16-root.simg.sha256
            out-ios16-root/d22ap.adt
          retention-days: 1

      - name: Upload ios16-root-aa
        uses: actions/upload-artifact@v4
        with:
          name: ios16-root-aa
          path: out-ios16-root/ios16-root.simg.tar.zst.part-aa
          compression-level: 0
          retention-days: 1

      - name: Upload ios16-root-ab
        uses: actions/upload-artifact@v4
        with:
          name: ios16-root-ab
          path: out-ios16-root/ios16-root.simg.tar.zst.part-ab
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload ios16-root-ac
        uses: actions/upload-artifact@v4
        with:
          name: ios16-root-ac
          path: out-ios16-root/ios16-root.simg.tar.zst.part-ac
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload ios16-root-ad
        uses: actions/upload-artifact@v4
        with:
          name: ios16-root-ad
          path: out-ios16-root/ios16-root.simg.tar.zst.part-ad
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload ios16-root-ae
        uses: actions/upload-artifact@v4
        with:
          name: ios16-root-ae
          path: out-ios16-root/ios16-root.simg.tar.zst.part-ae
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload ios16-root-af
        uses: actions/upload-artifact@v4
        with:
          name: ios16-root-af
          path: out-ios16-root/ios16-root.simg.tar.zst.part-af
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload ios16-root-ag
        uses: actions/upload-artifact@v4
        with:
          name: ios16-root-ag
          path: out-ios16-root/ios16-root.simg.tar.zst.part-ag
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload ios16-root-ah
        uses: actions/upload-artifact@v4
        with:
          name: ios16-root-ah
          path: out-ios16-root/ios16-root.simg.tar.zst.part-ah
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1
